<svg fill="none" viewBox="0 0 610 210" width="610" height="210" xmlns="http://www.w3.org/2000/svg">

  <foreignObject width="100%" height="100%">
    <div xmlns="http://www.w3.org/1999/xhtml" style="font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif; height: 100%; display: flex; align-items: center; justify-content: center;">

      <style>
        .hashnode-horizontal-card {
          --card-width: 600px;
          --card-padding: 20px;
          --line-height: 20px;

          display: flex;
          flex-direction: row;

          background: white;
          border: 1px solid #e0e0e0;
          border-radius: 8px;
          overflow: hidden;
          width: var(--card-width);
          height: 200px;
          box-sizing: border-box;
          box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .thumbnail-card {
          width: 220px;
          height: 160px;
          margin: var(--card-padding) var(--card-padding);
          background-color: #f3f3f3;
          border-radius: 6px;
          overflow: hidden;
          flex-shrink: 0;
          background-size: cover;
          background-position: center;
          aspect-ratio: 16 / 9;
        }

        .article-data-section {
          padding: var(--card-padding) var(--card-padding) 0 0;
          align-items: center;
        }

        .title-article {
          display: -webkit-box;
          -webkit-line-clamp: 2;
          -webkit-box-orient: vertical;
          overflow: hidden;
          text-overflow: ellipsis;
        }

        .brief-article {
          margin-top: 12px;
          font-size: 14px;
          color: #191919;
          line-height: var(--line-height);

          max-height: calc(var(--line-height) * 4);
          min-height: calc(var(--line-height) * 4);

          display: -webkit-box;
          -webkit-line-clamp: 4;
          -webkit-box-orient: vertical;
          overflow: hidden;
          text-overflow: ellipsis;
        }

      </style>

      <div class="hashnode-horizontal-card">
        <div class="thumbnail-card" style="background-image: url(${article.coverImage});">
        </div>

        <div class="article-data-section">
          <div style="display: flex; flex-direction: column; line-height: 1.2; min-width: 0; flex: 01">
            <span class="title-article" style="font-weight: 700; font-size: 15px; color: #191919;">${article.title}</span>
            <span style="font-size: 12px; color: #666; margin-top: 12px; text-align:right;">📆 ${article.publishedAt}</span>
            <div class="brief-article">
            ${article.brief}
            </div>
          </div>
        </div>
      </div>
    </div>
  </foreignObject>
</svg>